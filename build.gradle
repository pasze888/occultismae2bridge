plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // AE2: provides AECapabilities.ME_STORAGE and the MEStorage API we implement.
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    // Occultism: we read StorageControllerBlockEntity / MapItemStackHandler.
    implementation "curse.maven:occultism-361026:${occultism_file_id}"
    // Occultism 的必装前置，本模组不 import 它们的任何类，只是让本地运行时能加载 Occultism。
    // 用 localRuntime 而非 implementation：不进编译类路径，也不作为依赖对外发布。
    // curse.maven: 坐标没有 POM，依赖不传递，必须逐个显式声明，否则启动时 ModSorter 报
    // "Missing or unsupported mandatory dependencies"。fileID 写死，版本下限见注释。
    localRuntime "curse.maven:modonomicon-538392:8532346"    // 1.120.4，需要 >= 1.117.2
    localRuntime "curse.maven:geckolib-388172:8893490"       // 4.9.3，需要 >= 4.5.5
    localRuntime "curse.maven:curios-309927:6529130"         // 9.5.1，需要 >= 9.5.1
    localRuntime "curse.maven:smartbrainlib-661293:7055149"  // 1.16.11，需要 >= 1.14.5
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            ae2_version_range      : ae2_version_range,
            occultism_version_range: occultism_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    // 模板与产物统一按 UTF-8 处理：默认取平台字符集，GBK 下会把模板里的中文注释写坏成非法 UTF-8 字节，
    // FML 解析 neoforge.mods.toml 失败时会报 "is not a valid mod file"
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
